name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64
        shell: pwsh
        run: >-
          dotnet publish .\ScreenClipRecorder\ScreenClipRecorder.csproj
          -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:PublishSingleFile=false
          -p:DebugType=None -p:DebugSymbols=false
          -o .\artifacts\ScreenClipRecorder-win-x64

      - name: Include Visual C++ runtime
        shell: pwsh
        run: |
          $runtimeFiles = @(
            'vcruntime140.dll', 'vcruntime140_1.dll',
            'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll',
            'concrt140.dll'
          )
          foreach ($file in $runtimeFiles) {
            Copy-Item -LiteralPath "$env:WINDIR\System32\$file" `
              -Destination '.\artifacts\ScreenClipRecorder-win-x64' -Force
          }

      - name: Create download ZIP
        shell: pwsh
        run: >-
          Compress-Archive
          -Path .\artifacts\ScreenClipRecorder-win-x64\*
          -DestinationPath .\artifacts\ScreenClipRecorder-win-x64.zip
          -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenClipRecorder-win-x64
          path: artifacts/ScreenClipRecorder-win-x64.zip

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/ScreenClipRecorder-win-x64.zip
          generate_release_notes: true
